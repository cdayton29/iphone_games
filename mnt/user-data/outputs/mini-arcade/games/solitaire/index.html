<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Solitaire</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root {
  --bg: #10131F; --felt: #151A2C; --panel: #1A1F35; --panel-2: #232A44;
  --edge: rgba(255,255,255,.09); --ink: #ECEEF6; --muted: #8A92AE;
  --amber: #FFB020; --mint: #5FD6A9;
  --card: #F7F8FC; --card-ink: #1A1F35; --card-red: #D8483F;
  --display: Futura, "Avenir Next Condensed", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html[data-theme="light"] {
  --bg: #E9ECF3; --felt: #DFE4EE; --panel: #FFFFFF; --panel-2: #F2F4F9;
  --edge: rgba(16,19,31,.12); --ink: #171B2C; --muted: #5E6577;
  --amber: #C97A00; --mint: #17916A;
  --card: #FFFFFF; --card-ink: #171B2C; --card-red: #C7382F;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--felt); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; }

/* ---- toolbar. Left inset keeps clear of the hub's Menu button ---- */
#bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  height: calc(var(--safe-t) + 52px);
  padding: var(--safe-t) 10px 0 122px;
  display: flex; align-items: center; gap: 8px;
}
#bar .stat {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin-right: auto;
  line-height: 1.3;
}
#bar .stat b { display: block; color: var(--ink); font-weight: 600; letter-spacing: .1em; }
#bar button {
  height: 34px; padding: 0 13px; border-radius: 999px;
  border: 1px solid var(--edge); background: var(--panel);
  font-family: var(--display); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
}
#bar button:active { background: var(--panel-2); }
#bar button:disabled { opacity: .38; }

/* ---- board ---- */
#board { position: absolute; inset: calc(var(--safe-t) + 52px) 0 var(--safe-b) 0; }

.slot {
  position: absolute; border-radius: calc(var(--cw) * .1);
  border: 1.5px dashed var(--edge); background: rgba(0,0,0,.10);
  width: var(--cw); height: var(--ch);
}
html[data-theme="light"] .slot { background: rgba(16,19,31,.04); }
.slot .ghost {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: calc(var(--cw) * .42); color: var(--muted); opacity: .5;
}
.slot.recycle .ghost { font-size: calc(var(--cw) * .34); }

.card {
  position: absolute; top: 0; left: 0;
  width: var(--cw); height: var(--ch);
  border-radius: calc(var(--cw) * .1);
  background: var(--card); color: var(--card-ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.18);
  transition: transform .22s cubic-bezier(.2,.8,.3,1);
  will-change: transform;
  overflow: hidden;
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

.card.red { color: var(--card-red); }
.card .corner {
  position: absolute; top: calc(var(--ch) * .045); left: calc(var(--cw) * .09);
  font-family: var(--display); font-weight: 600;
  font-size: calc(var(--cw) * .38); line-height: 1.05; letter-spacing: .01em;
}
.card .corner small { display: block; font-size: calc(var(--cw) * .34); margin-top: -.06em; }
.card .pip {
  position: absolute; right: calc(var(--cw) * .07); bottom: calc(var(--ch) * .03);
  font-size: calc(var(--cw) * .62); opacity: .9; line-height: 1;
}

.card.down {
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 3px, transparent 3px 6px),
    linear-gradient(160deg, #3A4570, #232A44);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.10), 0 1px 2px rgba(0,0,0,.4);
}
.card.down .corner, .card.down .pip { display: none; }

.card.picked {
  box-shadow: 0 0 0 2.5px var(--amber), 0 6px 14px rgba(0,0,0,.45);
}
.card.hint { box-shadow: 0 0 0 2.5px var(--mint); }

/* ---- win banner ---- */
#win {
  position: absolute; inset: 0; z-index: 8; display: grid; place-items: center;
  background: rgba(21, 26, 44, .86);                             /* fallback */
  background: color-mix(in srgb, var(--felt) 84%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#win[hidden] { display: none; }
#win .panel {
  text-align: center; padding: 30px 34px; border-radius: 22px;
  background: var(--panel); border: 1px solid var(--edge);
  box-shadow: 0 18px 40px rgba(0,0,0,.5);
}
#win h2 {
  margin: 0 0 6px; font-family: var(--display); font-size: 26px;
  letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
}
#win p { margin: 0 0 20px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#win button {
  padding: 11px 24px; border-radius: 999px; background: var(--amber); color: #10131F;
  font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
}
</style>
</head>
<body>

<div id="bar">
  <div class="stat"><b id="stat-time">0:00</b><span id="stat-moves">0 moves</span></div>
  <button id="btn-undo" type="button">Undo</button>
  <button id="btn-auto" type="button">Collect</button>
  <button id="btn-new" type="button">Deal</button>
</div>

<div id="board"></div>

<div id="win" hidden>
  <div class="panel">
    <h2>Cleared</h2>
    <p id="win-stats"></p>
    <button id="btn-again" type="button">Deal again</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
