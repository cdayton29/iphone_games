<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Cadet Pinball</title>
<meta name="description" content="3D Pinball Space Cadet, running in the browser via WebAssembly.">
<meta name="theme-color" content="#080a26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinball">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg:#080a26; --fg:#e8ecff; --accent:#ffaa28; --muted:#8a90c0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden;
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  /* The canvas fills the whole screen; the game keeps its content clear of the notch /
     home indicator itself (insets are passed in from #safe). */
  #stage { position:fixed; inset:0; }
  #safe { position:fixed; visibility:hidden; pointer-events:none; padding:env(safe-area-inset-top)
    env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #canvas { display:block; width:100%; height:100%; outline:none; background:#000; }

  /* Loading / start screen */
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; background:radial-gradient(ellipse at 50% 40%, #1d1f6a, var(--bg) 70%);
    z-index:10; text-align:center; padding:24px; }
  #splash img { width:112px; height:112px; border-radius:24px; box-shadow:0 8px 30px #0008; }
  #splash h1 { margin:0; font-size:22px; letter-spacing:.04em; }
  #bar { width:min(280px,70vw); height:6px; border-radius:3px; background:#ffffff1a; overflow:hidden; }
  #bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #status { color:var(--muted); min-height:1.4em; }
  #play { display:none; font:inherit; font-weight:600; font-size:17px; color:#1a1030; background:var(--accent);
    border:0; border-radius:999px; padding:12px 34px; cursor:pointer; }
  #play:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  #keys { color:var(--muted); font-size:13px; max-width:420px; }
  #keys kbd { font:inherit; color:var(--fg); background:#ffffff14; border-radius:4px; padding:0 5px; }

  /* Touch controls: only shown on touch devices */
  #touch { position:fixed; inset:0; z-index:5; display:none; pointer-events:none; }
  body.touch #touch { display:block; }
  .zone { position:absolute; top:44px; bottom:0; pointer-events:auto; }
  #zl { left:0; width:50%; } #zr { right:0; width:50%; }
  .btn { position:absolute; pointer-events:auto; border:1px solid #ffffff40; color:#fff;
    background:#0008; border-radius:999px; font:600 13px system-ui, sans-serif; display:flex;
    align-items:center; justify-content:center; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .btn.on { background:var(--accent); color:#1a1030; }
  #bLaunch { right:calc(12px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom)); width:78px; height:78px; }
  #bNudge  { right:calc(15px + env(safe-area-inset-right)); bottom:calc(100px + env(safe-area-inset-bottom)); width:72px; height:40px; }
  #bNew    { left:calc(12px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); width:56px; height:40px; }
  #bPause  { left:calc(76px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); width:56px; height:40px; }
  .hint { position:absolute; top:50%; transform:translateY(-50%); color:#fff6; font:600 12px system-ui;
    pointer-events:none; letter-spacing:.08em; transition:opacity 1s; }
  #zl .hint { left:12px; } #zr .hint { right:12px; }
  body.played .hint { opacity:0; }
  /* While paused (pause screen + menus) or a dialog is open, let taps reach the game UI */
  body.paused #touch, body.modal #touch { display:none !important; }

  #update { position:fixed; left:50%; transform:translateX(-50%); top:calc(10px + env(safe-area-inset-top));
    z-index:20; display:none; background:#1d1f6a; border:1px solid #ffffff30; border-radius:999px;
    padding:6px 8px 6px 14px; gap:10px; align-items:center; font-size:13px; }
  #update button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:4px 12px;
    background:var(--accent); color:#1a1030; cursor:pointer; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>

<div id="touch" aria-hidden="true">
  <div class="zone" id="zl" data-a="0"><span class="hint">LEFT FLIPPER</span></div>
  <div class="zone" id="zr" data-a="1"><span class="hint">RIGHT FLIPPER</span></div>
  <div class="btn" id="bNew" data-a="10" data-tap>New</div>
  <div class="btn" id="bPause" data-a="11" data-tap>Pause</div>
  <div class="btn" id="bNudge" data-a="5">Nudge</div>
  <div class="btn" id="bLaunch" data-a="2">Launch</div>
</div>

<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <h1>Space Cadet Pinball</h1>
  <div id="bar"><i></i></div>
  <div id="status">Loading game (9 MB on first run)…</div>
  <button id="play" type="button">Play</button>
  <div id="keys"><kbd>Z</kbd> / <kbd>/</kbd> flippers · <kbd>Space</kbd> launch · <kbd>X</kbd> <kbd>.</kbd> <kbd>↑</kbd> nudge ·
    <kbd>F2</kbd> new game · <kbd>F3</kbd> pause &amp; menu. On touch screens, tap the left or right half of the screen.</div>
</div>

<div id="update" role="status">New version available <button type="button" id="reload">Reload</button></div>

<script>
(function () {
  'use strict';
  var canvas = document.getElementById('canvas');
  var splash = document.getElementById('splash');
  var bar = document.querySelector('#bar > i');
  var statusEl = document.getElementById('status');
  var playBtn = document.getElementById('play');
  var SAVE_DIR = '/libsdl';           // SDL_GetPrefPath() lives under here on Emscripten
  var ready = false, started = false, syncing = false, totalDeps = 0;

  function setStatus(t) { statusEl.textContent = t; }

  // --- Safe-area insets (notch, home indicator) -> game layout. SDL sizes the canvas
  // to the full window itself, so we only tell it which edges to keep clear.
  function sendInsets() {
    if (!ready || !Module._web_set_insets) return;
    var cs = getComputedStyle(document.getElementById('safe'));
    Module._web_set_insets(parseFloat(cs.paddingLeft) || 0, parseFloat(cs.paddingTop) || 0,
                           parseFloat(cs.paddingRight) || 0, parseFloat(cs.paddingBottom) || 0);
  }
  function fitCanvas() { sendInsets(); }

  // --- Persistent saves (high scores, options) via IndexedDB
  function persist() {
    if (syncing || !window.FS || !FS.syncfs) return;
    syncing = true;
    FS.syncfs(false, function (err) { syncing = false; if (err) console.warn('save failed', err); });
  }

  window.Module = {
    canvas: canvas,
    noInitialRun: true,       // wait for a user gesture so audio can start
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    preRun: [function () {
      FS.mkdir(SAVE_DIR);
      FS.mount(IDBFS, {}, SAVE_DIR);
      Module.addRunDependency('idbfs');
      FS.syncfs(true, function (err) {
        if (err) console.warn('load saves failed', err);
        Module.removeRunDependency('idbfs');
      });
    }],
    setStatus: function (t) {
      var m = t && t.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) { bar.style.width = (100 * m[1] / m[2]).toFixed(1) + '%'; setStatus('Downloading game data…'); }
    },
    monitorRunDependencies: function (left) {
      totalDeps = Math.max(totalDeps, left);
      if (left === 0) bar.style.width = '100%';
    },
    onRuntimeInitialized: function () {
      ready = true;
      bar.style.width = '100%';
      setStatus('Ready');
      playBtn.style.display = 'inline-block';
      playBtn.focus();
    },
    onAbort: function (what) {
      var msg = (what && what.type) ? 'a file failed to load (' + what.type + ')' : String(what);
      setStatus('Could not start the game: ' + msg + '. Try reloading the page.');
    }
  };

  function start() {
    if (!ready || started) return;
    started = true;
    splash.style.display = 'none';
    fitCanvas();
    try { Module.callMain([]); } catch (e) { if (e !== 'unwind' && !(e && e.name === 'ExitStatus')) throw e; }
    canvas.focus();
    setInterval(persist, 10000);
    // Mirror the game's pause/dialog state onto <body> so the touch overlay steps aside
    (function watchUi() {
      var st = Module._web_ui_state ? Module._web_ui_state() : 0;
      var wasPaused = document.body.classList.contains('paused');
      document.body.classList.toggle('paused', !!(st & 1));
      document.body.classList.toggle('modal', !!(st & 2));
      if ((st & 1) && !wasPaused) persist();
      requestAnimationFrame(watchUi);
    })();
    // Lock to landscape where supported when installed (the table + score panel is landscape)
    try { if (screen.orientation && screen.orientation.lock && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) screen.orientation.lock('landscape').catch(function(){}); } catch (e) {}
  }
  playBtn.addEventListener('click', start);
  document.addEventListener('keydown', function (e) { if (!started && ready && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); start(); } });

  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 300); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);

  // Stop the browser from scrolling/zooming on game keys
  window.addEventListener('keydown', function (e) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '/', 'F1', 'F2', 'F3', 'F5', 'F10'].indexOf(e.key) >= 0 && started) e.preventDefault();
  }, { capture: true });

  // --- Touch controls
  function key(a, down) { if (started && Module._web_key) Module._web_key(a, down ? 1 : 0); }
  function enableTouch() { document.body.classList.add('touch'); }
  if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) enableTouch();
  window.addEventListener('touchstart', enableTouch, { once: true, passive: true });

  var active = {}; // pointerId -> {el, a}
  document.querySelectorAll('#touch [data-a]').forEach(function (el) {
    var a = +el.dataset.a, tap = el.hasAttribute('data-tap');
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      active[e.pointerId] = { el: el, a: a };
      el.classList.add('on');
      key(a, true);
      if (tap) setTimeout(function () { key(a, false); }, 60);
      if (a <= 1) document.body.classList.add('played');
      if (navigator.vibrate && a <= 2) navigator.vibrate(8);
    });
    function up(e) {
      var s = active[e.pointerId]; if (!s) return;
      delete active[e.pointerId];
      s.el.classList.remove('on');
      if (!tap) key(s.a, false);
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // --- Service worker (offline + installable)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        nw && nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            var u = document.getElementById('update'); u.style.display = 'flex';
            document.getElementById('reload').onclick = function () {
              persist();
              navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
              nw.postMessage('skipWaiting');
            };
          }
        });
      });
    }).catch(function (e) { console.warn('SW registration failed', e); });
  }

  var tag = document.createElement('script');
  tag.src = 'SpaceCadetPinball.js';
  tag.onerror = function () { setStatus('Could not load SpaceCadetPinball.js — make sure it is in the same folder as index.html.'); };
  document.body.appendChild(tag);
  // indeterminate progress while the single-file engine downloads/compiles
  var p = 0, t = setInterval(function () { if (ready) return clearInterval(t); p = Math.min(92, p + (95 - p) * 0.05); bar.style.width = p + '%'; }, 150);
})();
</script>
</body>
</html>
