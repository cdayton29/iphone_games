<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Solitaire</title>

  <meta name="description" content="Offline Klondike Solitaire — installable, playable in airplane mode.">
  <meta name="theme-color" content="#083a1c">

  <!-- iOS standalone / home-screen behavior -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solitaire">
  <link rel="apple-touch-icon" href="./icon-180.png">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header id="status-bar">
      <span id="hud-moves" class="stat">0 moves</span>
      <span class="stat-divider" aria-hidden="true"></span>
      <span id="hud-time" class="stat">0:00</span>
    </header>

    <main id="board" aria-label="Solitaire board">
      <section class="row" id="top-row">
        <div class="pile" id="stock" data-p="s" aria-label="Stock"></div>
        <div class="pile waste" id="waste" data-p="w" aria-label="Waste"></div>
        <div class="top-spacer" aria-hidden="true"></div>
        <div class="pile foundation" data-p="f" data-pi="0" aria-label="Hearts foundation"></div>
        <div class="pile foundation" data-p="f" data-pi="1" aria-label="Diamonds foundation"></div>
        <div class="pile foundation" data-p="f" data-pi="2" aria-label="Clubs foundation"></div>
        <div class="pile foundation" data-p="f" data-pi="3" aria-label="Spades foundation"></div>
      </section>

      <section class="row" id="tableau-row">
        <div class="pile tableau" data-p="t" data-pi="0"></div>
        <div class="pile tableau" data-p="t" data-pi="1"></div>
        <div class="pile tableau" data-p="t" data-pi="2"></div>
        <div class="pile tableau" data-p="t" data-pi="3"></div>
        <div class="pile tableau" data-p="t" data-pi="4"></div>
        <div class="pile tableau" data-p="t" data-pi="5"></div>
        <div class="pile tableau" data-p="t" data-pi="6"></div>
      </section>
    </main>

    <nav id="hud" aria-label="Game controls">
      <button id="btn-new" type="button">
        <span class="btn-icon" aria-hidden="true">&#10022;</span>
        <span class="btn-label">New</span>
      </button>
      <button id="btn-restart" type="button" title="Redeal this same game">
        <span class="btn-icon" aria-hidden="true">&#8634;</span>
        <span class="btn-label">Restart</span>
      </button>
      <button id="btn-undo" type="button" disabled>
        <span class="btn-icon" aria-hidden="true">&#8617;</span>
        <span class="btn-label">Undo</span>
      </button>
      <button id="btn-draw" type="button" title="Toggle draw mode">
        <span class="btn-icon" aria-hidden="true">&#9737;</span>
        <span class="btn-label">Draw 1</span>
      </button>
    </nav>

    <div id="drag-layer" aria-hidden="true"></div>
    <div id="fx-layer" aria-hidden="true"></div>

    <div id="win-overlay" class="hidden" role="dialog" aria-label="Game won">
      <div class="win-panel">
        <div class="win-title">You won!</div>
        <div class="win-stats" id="win-stats"></div>
        <button id="btn-win-new" type="button">New game</button>
      </div>
    </div>
  </div>

  <script src="./game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
