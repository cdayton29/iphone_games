<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Chess</title>
<style>
/* ============================================================
   ARCADE CHESS — tournament-vinyl board, scoresheet log
   Self-contained styles. No external fonts or assets.
   ============================================================ */
:root{
  --bg:        #161a20;
  --panel:     #1f252e;
  --panel-2:   #262d38;
  --ink:       #ece7da;
  --dim:       #8b93a0;
  --line:      #323a46;
  --sq-light:  #eae3c9;
  --sq-dark:   #728c58;
  --accent:    #e9a63c;   /* amber: selection / last move   */
  --danger:    #d95f4c;   /* check / losses                 */
  --ok:        #8fb573;   /* wins                           */
  --white-pc:  #f7f3e8;
  --black-pc:  #2b2b28;
  --radius:    14px;
  --board-max: 520px;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html, body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;               /* no rubber-banding      */
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;              /* kills double-tap zoom  */
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  justify-content:center;
}

#app{
  width:100%;
  max-width:560px;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:calc(6px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
  gap:6px;
}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:10px;
  padding:2px 2px 0;
}
header .mark{
  font-size:22px; line-height:1;
  color:var(--accent);
  transform:translateY(-1px);
}
header h1{
  font-size:15px; font-weight:800;
  letter-spacing:.28em; text-transform:uppercase;
}
header .spacer{ flex:1; }
#statsLine{
  font-size:11px; color:var(--dim);
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
  white-space:nowrap;
}
#statsLine b{ color:var(--ink); font-weight:700; }

/* ---------- capture strips ---------- */
.capt{
  min-height:22px;
  display:flex; align-items:center; gap:1px;
  padding:0 4px;
  font-size:17px; line-height:1;
  overflow:hidden;
}
.capt .cw{ color:var(--white-pc); text-shadow:0 0 1px #000, 0 1px 1px rgba(0,0,0,.6); }
.capt .cb{ color:var(--black-pc); text-shadow:0 0 1px rgba(255,255,255,.35); }
.capt .diff{
  margin-left:6px; font-size:11px; font-weight:700; color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.capt .who{
  font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); margin-right:8px; min-width:52px;
}

/* ---------- board ---------- */
#boardWrap{
  position:relative;
  width:min(100%, var(--board-max));
  margin:0 auto;
  flex-shrink:0;
}
#board{
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  grid-template-rows:repeat(8, 1fr);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 0 0 4px #10131a, 0 0 0 5px var(--line), 0 12px 30px rgba(0,0,0,.45);
  touch-action:none;                      /* board owns all touches */
  transition:transform .45s cubic-bezier(.4,.1,.2,1);
}
#board.flip{ transform:rotate(180deg); }

.sq{ position:relative; background:var(--sq-light); }
.sq.dark{ background:var(--sq-dark); }

.sq .pc{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(min(100vw, var(--board-max)) / 8 * .78);
  line-height:1;
  pointer-events:none;
  transition:transform .45s cubic-bezier(.4,.1,.2,1);
}
#board.flip .sq .pc,
#board.flip .sq .coord{ transform:rotate(180deg); }

.pc.w{ color:var(--white-pc); text-shadow:0 0 1.5px #3a3a35, 0 1.5px 2px rgba(0,0,0,.45); }
.pc.b{ color:var(--black-pc); text-shadow:0 0 1.5px rgba(255,255,255,.30), 0 1.5px 2px rgba(0,0,0,.35); }

/* coordinates on edge squares */
.sq .coord{
  position:absolute; font-size:9px; font-weight:700;
  pointer-events:none; opacity:.75;
  transition:transform .45s cubic-bezier(.4,.1,.2,1);
}
.sq .coord.file{ right:3px; bottom:2px; }
.sq .coord.rank{ left:3px; top:2px; }
.sq.dark .coord{ color:var(--sq-light); }
.sq:not(.dark) .coord{ color:var(--sq-dark); }

/* move / state highlights */
.sq.last::before{
  content:""; position:absolute; inset:0;
  background:rgba(233,166,60,.32);
}
.sq.sel::before{
  content:""; position:absolute; inset:0;
  background:rgba(233,166,60,.45);
  box-shadow:inset 0 0 0 3px var(--accent);
}
.sq.dot::after{
  content:""; position:absolute;
  width:30%; height:30%; left:35%; top:35%;
  border-radius:50%;
  background:rgba(20,24,18,.28);
}
.sq.take::after{
  content:""; position:absolute; inset:5%;
  border-radius:50%;
  border:3.5px solid rgba(20,24,18,.32);
}
.sq.check::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%, rgba(217,95,76,.85) 0%, rgba(217,95,76,.35) 55%, transparent 75%);
}
.sq.ghosted .pc{ opacity:.25; }

/* drag ghost */
#dragGhost{
  position:fixed; left:0; top:0; z-index:60;
  pointer-events:none; display:none;
  font-size:calc(min(100vw, var(--board-max)) / 8 * .95);
  line-height:1;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));
  transform:translate(-50%, -65%);
}
#dragGhost.on{ display:block; }

/* ---------- turn bar / controls ---------- */
#turnBar{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:12px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim);
  min-height:18px;
}
#turnBar .swatch{
  width:12px; height:12px; border-radius:50%;
  border:1.5px solid var(--line);
}
#turnBar .swatch.w{ background:var(--white-pc); }
#turnBar .swatch.b{ background:var(--black-pc); }
#turnBar.thinking{ color:var(--accent); }
#turnBar.over{ color:var(--accent); }

.controls{
  display:flex; gap:8px; justify-content:center;
}
button{
  font:inherit; color:var(--ink);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 18px;
  font-size:13px; font-weight:700;
  letter-spacing:.03em;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button:active{ background:var(--panel-2); transform:translateY(1px); }
button:disabled{ opacity:.35; pointer-events:none; }
button.primary{ background:var(--accent); border-color:var(--accent); color:#1c1508; }
button.ghost{ background:transparent; }

/* ---------- move log (scoresheet) ---------- */
#logWrap{
  flex:1 1 0;
  min-height:44px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  display:flex; flex-direction:column;
}
#logWrap .logTitle{
  font-size:10px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
  color:var(--dim);
  padding:7px 12px 5px;
  border-bottom:1px dashed var(--line);
}
#moveLog{
  flex:1; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:4px 12px 8px;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:12.5px; line-height:1.9;
  font-variant-numeric:tabular-nums;
}
#moveLog .row{
  display:grid;
  grid-template-columns:2.4em 1fr 1fr;
  border-bottom:1px dotted rgba(139,147,160,.18);
}
#moveLog .num{ color:var(--dim); }
#moveLog .empty{ color:var(--dim); font-style:italic; }

/* ---------- overlays ---------- */
.overlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(10,12,16,.72);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  display:none;
  align-items:center; justify-content:center;
  padding:20px;
}
.overlay.on{ display:flex; }
.sheet{
  width:100%; max-width:380px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.sheet h2{
  font-size:13px; font-weight:800;
  letter-spacing:.24em; text-transform:uppercase;
  text-align:center;
  margin-bottom:14px;
}
.sheet .sub{
  text-align:center; color:var(--dim); font-size:12px;
  margin:-8px 0 14px;
}
.fieldLabel{
  font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim);
  margin:12px 2px 6px;
}
.seg{
  display:flex; background:var(--bg);
  border:1px solid var(--line); border-radius:12px;
  padding:3px; gap:3px;
}
.seg button{
  flex:1; border:none; background:transparent; border-radius:9px;
  padding:9px 4px; font-size:12.5px; color:var(--dim);
}
.seg button.on{ background:var(--panel-2); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--accent); }
.toggleRow{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:12px; padding:2px 2px;
  font-size:13px;
}
.toggleRow small{ display:block; color:var(--dim); font-size:11px; margin-top:2px; }
.switch{
  width:46px; height:27px; border-radius:999px; flex-shrink:0;
  background:var(--bg); border:1px solid var(--line);
  position:relative; padding:0;
}
.switch::after{
  content:""; position:absolute; top:2.5px; left:3px;
  width:20px; height:20px; border-radius:50%;
  background:var(--dim);
  transition:transform .18s ease, background .18s ease;
}
.switch.on{ background:rgba(233,166,60,.25); border-color:var(--accent); }
.switch.on::after{ transform:translateX(19px); background:var(--accent); }
.sheet .actions{ display:flex; gap:8px; margin-top:18px; }
.sheet .actions button{ flex:1; padding:12px; }
.statsGrid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
  margin-top:6px; text-align:center;
}
.statsGrid .cell{
  background:var(--bg); border:1px solid var(--line); border-radius:10px;
  padding:8px 2px;
}
.statsGrid .v{ font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
.statsGrid .k{ font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:2px; }
.statsGrid .v.win{ color:var(--ok); } .statsGrid .v.loss{ color:var(--danger); }
#btnResetStats{ margin:10px auto 0; display:block; font-size:11px; padding:6px 14px; color:var(--dim); }

/* promotion picker */
#promoRow{ display:flex; gap:8px; }
#promoRow button{
  flex:1; aspect-ratio:1; border-radius:14px;
  font-size:40px; line-height:1; padding:0;
  background:var(--bg);
}
#promoRow button:active{ background:var(--panel-2); }
#promoRow .pc{ text-shadow:none; }

/* game over */
#overTitle{ font-size:19px; letter-spacing:.1em; }
#overDetail{ margin-bottom:4px; }

@media (max-height:640px){
  header h1{ font-size:13px; }
  .capt{ min-height:18px; font-size:14px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="mark">&#9822;</span>
    <h1>Chess</h1>
    <span class="spacer"></span>
    <div id="statsLine"></div>
  </header>

  <div class="capt" id="captTop"></div>

  <div id="boardWrap">
    <div id="board"></div>
  </div>

  <div class="capt" id="captBottom"></div>

  <div id="turnBar"></div>

  <div class="controls">
    <button id="btnUndo">&#8630; Undo</button>
    <button id="btnNew" class="ghost">New game</button>
  </div>

  <div id="logWrap">
    <div class="logTitle">Scoresheet</div>
    <div id="moveLog"></div>
  </div>
</div>

<div id="dragGhost"></div>

<!-- New game / settings -->
<div class="overlay" id="setupOverlay">
  <div class="sheet">
    <h2>New Game</h2>
    <div class="fieldLabel">Mode</div>
    <div class="seg" id="segMode">
      <button data-v="2p">Pass &amp; Play</button>
      <button data-v="ai">vs Computer</button>
    </div>
    <div id="aiOpts">
      <div class="fieldLabel">Difficulty</div>
      <div class="seg" id="segDiff">
        <button data-v="easy">Easy</button>
        <button data-v="med">Medium</button>
        <button data-v="hard">Hard</button>
      </div>
      <div class="fieldLabel">Play as</div>
      <div class="seg" id="segSide">
        <button data-v="w">White</button>
        <button data-v="b">Black</button>
      </div>
    </div>
    <div id="rotOpt" class="toggleRow">
      <div>Auto-rotate board<small>Board turns to face the player to move</small></div>
      <button class="switch" id="swRotate" aria-label="Auto-rotate board"></button>
    </div>
    <div class="fieldLabel">Record</div>
    <div class="statsGrid" id="statsGrid"></div>
    <button id="btnResetStats" class="ghost">Reset record</button>
    <div class="actions">
      <button id="btnCancelSetup" class="ghost">Back</button>
      <button id="btnStart" class="primary">Start game</button>
    </div>
  </div>
</div>

<!-- Pawn promotion -->
<div class="overlay" id="promoOverlay">
  <div class="sheet">
    <h2>Promote to</h2>
    <div id="promoRow"></div>
  </div>
</div>

<!-- Game over -->
<div class="overlay" id="overOverlay">
  <div class="sheet">
    <h2 id="overTitle"></h2>
    <div class="sub" id="overDetail"></div>
    <div class="actions">
      <button id="btnReview" class="ghost">View board</button>
      <button id="btnRematch" class="primary">New game</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
