<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Sudoku</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root {
  --bg: #10131F; --panel: #1A1F35; --panel-2: #232A44; --well: #0C0F1A;
  --edge: rgba(255,255,255,.09); --line: rgba(255,255,255,.13); --rule: rgba(255,255,255,.34);
  --ink: #ECEEF6; --muted: #8A92AE; --amber: #FFB020; --mint: #5FD6A9; --wrong: #E85D5D;
  --peer: rgba(255,255,255,.045); --sel: rgba(255,176,32,.17); --twin: rgba(95,214,169,.13);
  --display: Futura, "Avenir Next Condensed", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --size: 320px;
}
html[data-theme="light"] {
  --bg: #E9ECF3; --panel: #FFFFFF; --panel-2: #F2F4F9; --well: #DCE1EC;
  --edge: rgba(16,19,31,.12); --line: rgba(16,19,31,.16); --rule: rgba(16,19,31,.42);
  --ink: #171B2C; --muted: #5E6577; --amber: #C97A00; --mint: #17916A; --wrong: #C7382F;
  --peer: rgba(16,19,31,.045); --sel: rgba(201,122,0,.16); --twin: rgba(23,145,106,.13);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; }

body {
  display: flex; flex-direction: column;
  padding: var(--safe-t) 0 var(--safe-b);
}

/* ---- toolbar: left inset clears the hub's Menu button ---- */
#bar {
  flex: none; height: 52px; display: flex; align-items: center; gap: 8px;
  padding: 0 12px 0 122px;
}
#bar .stat {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin-right: auto; line-height: 1.3;
}
#bar .stat b { display: block; color: var(--ink); font-weight: 600; }
#bar button {
  height: 34px; padding: 0 13px; border-radius: 999px;
  border: 1px solid var(--edge); background: var(--panel);
  font-family: var(--display); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
}
#bar button:active { background: var(--panel-2); }

/* ---- grid ---- */
#stage { flex: 1; display: grid; place-items: center; padding: 4px 12px; min-height: 0; }

#grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: var(--size); height: var(--size);
  background: var(--panel);
  border: 2px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
}
.cell {
  position: relative;
  display: grid; place-items: center;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-family: var(--display);
  font-size: calc(var(--size) / 16);
  font-weight: 500;
  color: var(--amber);
  transition: background-color .12s ease;
}
.cell:nth-child(9n) { border-right: 0; }
.cell:nth-child(n+73) { border-bottom: 0; }
.cell.br { border-right: 2px solid var(--rule); }
.cell.bb { border-bottom: 2px solid var(--rule); }

.cell.given { color: var(--ink); font-weight: 600; }
.cell.wrong { color: var(--wrong); }
.cell.hinted { color: var(--mint); }
.cell.peer { background: var(--peer); }
.cell.twin { background: var(--twin); }
.cell.sel  { background: var(--sel); box-shadow: inset 0 0 0 2px var(--amber); }

.notes {
  position: absolute; inset: 6%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  font-family: var(--mono); font-size: calc(var(--size) / 38);
  color: var(--muted); font-weight: 400;
}
.notes span { display: grid; place-items: center; }

/* ---- keypad ---- */
#pad { flex: none; padding: 6px 10px 12px; display: grid; gap: 7px; }
#digits { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
#digits button {
  height: 50px; border-radius: 12px; background: var(--panel); border: 1px solid var(--edge);
  font-family: var(--display); font-size: 21px; font-weight: 500; color: var(--amber);
  display: grid; place-items: center; line-height: 1;
}
#digits button small {
  display: block; font-family: var(--mono); font-size: 8.5px; color: var(--muted); margin-top: 2px;
}
#digits button:active { background: var(--panel-2); }
#digits button.done { opacity: .34; }

#actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
#actions button {
  height: 40px; border-radius: 12px; background: var(--panel); border: 1px solid var(--edge);
  font-family: var(--display); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
}
#actions button:active { background: var(--panel-2); }
#actions button[aria-pressed="true"] { background: var(--amber); color: #10131F; border-color: transparent; }
#actions button:disabled { opacity: .38; }

/* ---- overlays ---- */
.sheet {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
  background: rgba(8,10,18,.62);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: 24px;
}
.sheet[hidden] { display: none; }
.sheet .panel {
  width: 100%; max-width: 320px; text-align: center;
  padding: 26px 24px; border-radius: 22px;
  background: var(--panel); border: 1px solid var(--edge);
  box-shadow: 0 18px 40px rgba(0,0,0,.5);
}
.sheet h2 {
  margin: 0 0 4px; font-family: var(--display); font-size: 23px;
  letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
}
.sheet p {
  margin: 0 0 18px; font-family: var(--mono); font-size: 10.5px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.sheet .choices { display: grid; gap: 8px; }
.sheet .choices button {
  height: 46px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--edge);
  font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
}
.sheet .choices button:active { background: var(--amber); color: #10131F; }
.sheet .choices button span {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--muted);
}
.sheet .choices button:active span { color: #10131F; }
.sheet .ghost-btn { margin-top: 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>

<div id="bar">
  <div class="stat"><b id="stat-time">0:00</b><span id="stat-diff">—</span></div>
  <button id="btn-check" type="button">Check</button>
  <button id="btn-new" type="button">New</button>
</div>

<div id="stage"><div id="grid" role="grid" aria-label="Sudoku grid"></div></div>

<div id="pad">
  <div id="digits"></div>
  <div id="actions">
    <button id="btn-notes" type="button" aria-pressed="false">Notes</button>
    <button id="btn-erase" type="button">Erase</button>
    <button id="btn-undo" type="button">Undo</button>
    <button id="btn-hint" type="button">Hint</button>
  </div>
</div>

<div id="picker" class="sheet" hidden>
  <div class="panel">
    <h2>New puzzle</h2>
    <p>Every one has a single solution</p>
    <div class="choices">
      <button type="button" data-clues="46">Gentle <span>~46 clues</span></button>
      <button type="button" data-clues="38">Steady <span>~38 clues</span></button>
      <button type="button" data-clues="31">Tricky <span>~31 clues</span></button>
      <button type="button" data-clues="26">Severe <span>~26 clues</span></button>
    </div>
    <button id="picker-cancel" class="ghost-btn" type="button">Keep playing</button>
  </div>
</div>

<div id="win" class="sheet" hidden>
  <div class="panel">
    <h2>Solved</h2>
    <p id="win-stats"></p>
    <div class="choices"><button id="btn-again" type="button">New puzzle <span>choose level</span></button></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
